<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="50%" stop-color="#0d111a"/>
      <stop offset="100%" stop-color="#080b12"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151b28"/>
      <stop offset="100%" stop-color="#101520"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="greenBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="waveFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.32"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Main Window Frame -->
  <rect width="1200" height="720" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- macOS / Studio Title Bar -->
  <rect x="2" y="2" width="1196" height="46" rx="14" fill="#0d121c"/>
  <line x1="0" y1="48" x2="1200" y2="48" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="28" cy="25" r="6.5" fill="#ef4444"/>
  <circle cx="48" cy="25" r="6.5" fill="#f59e0b"/>
  <circle cx="68" cy="25" r="6.5" fill="#22c55e"/>
  <text x="600" y="30" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="13" font-weight="600">
    Shorts Loop Inspector Studio — WebAudio &amp; FFmpeg DSP Seam Analyzer (v0.2.0)
  </text>

  <!-- Top App Header -->
  <text x="42" y="92" fill="#f8fafc" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="24" font-weight="800">
    SHORTS LOOP INSPECTOR
  </text>
  <rect x="365" y="72" width="142" height="26" rx="13" fill="#0f2922" stroke="#10b981" stroke-width="1.2"/>
  <circle cx="381" cy="85" r="4.5" fill="#10b981"/>
  <text x="394" y="89" fill="#34d399" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="11.5" font-weight="700">
    PASS • SEAMLESS
  </text>
  <text x="42" y="116" fill="#64748b" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="13">
    Loaded Media: phonk_montagem_128bpm_master.wav (44.1 kHz, 16-bit Stereo, 3.7500s / 8 Beats)
  </text>

  <!-- Action Buttons Top Right -->
  <rect x="850" y="72" width="150" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="925" y="95" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5" font-weight="600">
    ▶ Audition Seam (2x)
  </text>
  <rect x="1012" y="72" width="146" height="36" rx="8" fill="url(#cyanGlow)"/>
  <text x="1085" y="95" text-anchor="middle" fill="#090d16" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5" font-weight="700">
    Export Fixed WAV
  </text>

  <!-- 4 Metric KPI Cards -->
  <!-- Card 1: Score -->
  <g filter="url(#softShadow)">
    <rect x="42" y="138" width="262" height="114" rx="12" fill="url(#panelGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <text x="62" y="166" fill="#94a3b8" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.8">
      LOOP QUALITY SCORE
    </text>
    <text x="62" y="214" fill="#22c55e" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="38" font-weight="800">
      98.6
    </text>
    <text x="152" y="214" fill="#64748b" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="20" font-weight="600">
      / 100
    </text>
    <rect x="224" y="185" width="60" height="28" rx="6" fill="url(#greenBadge)"/>
    <text x="254" y="204" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="13" font-weight="800">
      GRADE A
    </text>
    <text x="62" y="238" fill="#10b981" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="11.5">
      ✓ Zero-crossing phase locked
    </text>
  </g>

  <!-- Card 2: Boundary Jump -->
  <g filter="url(#softShadow)">
    <rect x="326" y="138" width="262" height="114" rx="12" fill="url(#panelGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <text x="346" y="166" fill="#94a3b8" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.8">
      SEAM SAMPLE DISCONTINUITY
    </text>
    <text x="346" y="214" fill="#38bdf8" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="34" font-weight="800">
      -96.0 dBFS
    </text>
    <text x="346" y="238" fill="#64748b" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="11.5">
      Threshold: &lt; -35.0 dBFS (Click-Free)
    </text>
  </g>

  <!-- Card 3: Loudness Continuity -->
  <g filter="url(#softShadow)">
    <rect x="610" y="138" width="262" height="114" rx="12" fill="url(#panelGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <text x="630" y="166" fill="#94a3b8" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.8">
      TAIL → HEAD RMS DELTA
    </text>
    <text x="630" y="214" fill="#f8fafc" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="34" font-weight="800">
      0.04 dB
    </text>
    <text x="630" y="238" fill="#64748b" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="11.5">
      Spectral Flux Cosine Dist: 0.0003
    </text>
  </g>

  <!-- Card 4: Tempo & Grid -->
  <g filter="url(#softShadow)">
    <rect x="894" y="138" width="264" height="114" rx="12" fill="url(#panelGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <text x="914" y="166" fill="#94a3b8" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.8">
      DETECTED TEMPO &amp; BEAT GRID
    </text>
    <text x="914" y="214" fill="#a855f7" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="34" font-weight="800">
      128.0 BPM
    </text>
    <text x="914" y="238" fill="#10b981" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="11.5">
      Grid Drift: 0.2 ms (8 Exact Beats)
    </text>
  </g>

  <!-- Center Panel: High-Res Seam Oscilloscope -->
  <g filter="url(#softShadow)">
    <rect x="42" y="272" width="760" height="276" rx="12" fill="url(#panelGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <text x="64" y="302" fill="#e2e8f0" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="13.5" font-weight="700">
      LOOP SEAM OSCILLOSCOPE (TAIL -25ms → SEAM BOUNDARY → HEAD +25ms)
    </text>
    <text x="625" y="302" fill="#38bdf8" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12" font-weight="600">
      Zoom: 16x Sample-Accurate
    </text>

    <!-- Oscilloscope Inner Screen -->
    <rect x="62" y="316" width="720" height="212" rx="8" fill="#070a10" stroke="#1e293b" stroke-width="1"/>

    <!-- Grid Lines -->
    <line x1="62" y1="369" x2="782" y2="369" stroke="#131c2e" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="62" y1="422" x2="782" y2="422" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="62" y1="475" x2="782" y2="475" stroke="#131c2e" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- Region Shading -->
    <rect x="62" y="316" width="360" height="212" fill="#38bdf8" fill-opacity="0.03"/>
    <rect x="422" y="316" width="360" height="212" fill="#10b981" fill-opacity="0.03"/>

    <!-- Seam Center Vertical Marker -->
    <line x1="422" y1="316" x2="422" y2="528" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 3"/>
    <rect x="357" y="324" width="130" height="22" rx="4" fill="#f59e0b"/>
    <text x="422" y="339" text-anchor="middle" fill="#090d16" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="10.5" font-weight="800">
      LOOP WRAP SEAM (0.00s)
    </text>

    <!-- Continuous Sine/Synth Waveform Across Seam -->
    <path d="M 62 422
             Q 84 340, 107 422 T 152 422 T 197 422 T 242 422 T 287 422 T 332 422 T 377 422 T 422 422
             T 467 422 T 512 422 T 557 422 T 602 422 T 647 422 T 692 422 T 737 422 T 782 422"
          fill="url(#waveFill)" stroke="url(#cyanGlow)" stroke-width="3" stroke-linecap="round"/>

    <!-- Zero-Crossing Lock Indicator Circle -->
    <circle cx="422" cy="422" r="7" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
    <text x="80" y="514" fill="#64748b" font-family="Consolas, monospace" font-size="11">
      TAIL: [3.725s .. 3.750s]
    </text>
    <text x="615" y="514" fill="#64748b" font-family="Consolas, monospace" font-size="11">
      HEAD: [0.000s .. 0.025s]
    </text>
  </g>

  <!-- Right Panel: Beat Grid & Spectral Continuity -->
  <g filter="url(#softShadow)">
    <rect x="822" y="272" width="336" height="276" rx="12" fill="url(#panelGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <text x="844" y="302" fill="#e2e8f0" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="13.5" font-weight="700">
      SPECTRAL &amp; FRAME DIAGNOSTICS
    </text>

    <!-- Spectral Bars -->
    <rect x="844" y="320" width="292" height="96" rx="8" fill="#070a10" stroke="#1e293b" stroke-width="1"/>
    <text x="856" y="338" fill="#94a3b8" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="10.5" font-weight="600">
      FFT BOUNDARY SPECTRUM OVERLAY (TAIL vs HEAD)
    </text>
    <!-- Bars -->
    <g fill="#38bdf8" opacity="0.85">
      <rect x="860" y="356" width="12" height="50" rx="2"/>
      <rect x="880" y="348" width="12" height="58" rx="2"/>
      <rect x="900" y="362" width="12" height="44" rx="2"/>
      <rect x="920" y="370" width="12" height="36" rx="2"/>
      <rect x="940" y="365" width="12" height="41" rx="2"/>
      <rect x="960" y="376" width="12" height="30" rx="2"/>
      <rect x="980" y="382" width="12" height="24" rx="2"/>
      <rect x="1000" y="374" width="12" height="32" rx="2"/>
      <rect x="1020" y="386" width="12" height="20" rx="2"/>
      <rect x="1040" y="390" width="12" height="16" rx="2"/>
      <rect x="1060" y="393" width="12" height="13" rx="2"/>
      <rect x="1080" y="396" width="12" height="10" rx="2"/>
      <rect x="1100" y="398" width="12" height="8" rx="2"/>
    </g>

    <!-- Checklist Items -->
    <rect x="844" y="428" width="292" height="30" rx="6" fill="#0c1917" stroke="#065f46" stroke-width="1"/>
    <text x="858" y="448" fill="#34d399" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12" font-weight="600">
      ✓ Zero-Crossing Rising Slope Matched
    </text>

    <rect x="844" y="466" width="292" height="30" rx="6" fill="#0c1917" stroke="#065f46" stroke-width="1"/>
    <text x="858" y="486" fill="#34d399" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12" font-weight="600">
      ✓ Video Last→First Frame RMSE: 3.12 (Seamless)
    </text>

    <rect x="844" y="504" width="292" height="30" rx="6" fill="#0c1917" stroke="#065f46" stroke-width="1"/>
    <text x="858" y="524" fill="#34d399" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12" font-weight="600">
      ✓ CI/CD Gate: PASS (--fail-under 85)
    </text>
  </g>

  <!-- Bottom Panel: Auto-Generated FFmpeg Trim & Micro-Crossfade Command -->
  <g filter="url(#softShadow)">
    <rect x="42" y="568" width="1116" height="114" rx="12" fill="url(#panelGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <text x="64" y="596" fill="#94a3b8" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.8">
      SAMPLE-ACCURATE FFMPEG AUTO-FIX COMMAND (ZERO-CROSSING LOCK + 15MS MICRO-FADE)
    </text>
    <rect x="62" y="610" width="1076" height="54" rx="8" fill="#070a10" stroke="#1e293b" stroke-width="1"/>
    <text x="80" y="642" fill="#38bdf8" font-family="Consolas, 'Courier New', monospace" font-size="13.5" font-weight="600">
      $ ffmpeg -y -i "input_clip.mp4" -af "atrim=start=0.0000:end=3.7409,asetpts=PTS-STARTPTS,afade=t=in:st=0:d=0.005,afade=t=out:st=3.7259:d=0.015" "fixed_loop.mp4"
    </text>
  </g>
</svg>
