[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shorts-loop-inspector"
version = "0.2.0"
description = "Deterministic audio/video seamless loop analyzer, zero-crossing discontinuity detector, and beat-locked trim calculator for short-form media pipelines."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Newz Walker", email = "srtpp072@gmail.com" }
]
keywords = ["audio", "video", "loop", "shorts", "ffmpeg", "dsp", "beat-detection", "qa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
shorts-loop-inspector = "shorts_loop_inspector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
